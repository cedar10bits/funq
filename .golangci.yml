version: "2"

# Linting only. Formatting stays with the pinned gofumpt step in CI
# (see .github/workflows/ci.yml).
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint    # correct error wrapping / comparison (funq has grooveError + Unwrap)
    - misspell     # typos in comments and strings
    - nolintlint   # keep //nolint directives honest and specific
    - predeclared  # shadowing predeclared identifiers
    - unconvert    # redundant type conversions
  exclusions:
    rules:
      # These declarations spell out the type on purpose: the test is that a
      # method value (chain.Run / track.Play) is assignable to the exported
      # function type. Fp/Fe are type aliases, so staticcheck sees the
      # annotation as redundant (ST1023); here it is the assertion.
      - path: compose_test\.go
        linters: [staticcheck]
        text: 'ST1023|QF1011'

formatters:
  enable: [] # gofumpt runs as its own pinned CI step

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
