name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The gofumpt version is pinned because its formatting rules can change
      # between releases.
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          test -z "$(gofumpt -l .)"
      - name: go vet
        run: go vet ./...
      # golangci-lint is pinned for the same reason as gofumpt above: new
      # checks and changed rules between releases would fail unrelated PRs.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...
      - name: go test
        run: go test -race ./...
