name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catches a breaking Go or golangci-lint release apart from any commit.
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # go.mod's minimum; setup-go picks that release's latest patch.
          - name: go.mod
            go-version-file: go.mod
          - name: stable
            go-version: stable
            lint: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          check-latest: true
      # The gofumpt version is pinned because its formatting rules can change
      # between releases.
      - name: gofumpt
        if: matrix.lint
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          test -z "$(gofumpt -l .)"
      - name: go vet
        run: go vet ./...
      # Not pinned: it reads the toolchain's export data, so it must keep up
      # with stable Go.
      - name: golangci-lint
        if: matrix.lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint version
          golangci-lint run ./...
      - name: go test
        run: go test -race ./...

